name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig fmt (check)
        run: zig fmt --check build.zig src

  build-test:
    name: Build / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build test
        run: zig build test

  moon:
    name: moon build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install moon
        uses: dbrrt/setup-moon@v1.0.0

      - name: moon build (desktop CLI)
        run: moon run authdog-cli:build

      - name: moon test
        run: moon run authdog-cli:test
