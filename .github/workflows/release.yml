name: Release

# Multi-platform binaries + GitHub Release for version tags pushed to GitHub (e.g. `git push origin 0.1.0`).
# Tag format follows `just tag-push` / "Create release tag" workflow (`X.Y.Z` or `X.Y.Z-beta.<n>`; no leading `v`).
# Manual re-run from the Actions tab for an existing tag: workflow_dispatch with the same tag name.
#
# Archive names stay on the installer triples in install/src/index.ts. Zig cross-compiles those
# binaries from Linux; the Windows archive is still named x86_64-pc-windows-msvc.

on:
  push:
    tags:
      # Bare semver tags only (no leading `v`).
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. 0.1.0 or 0.1.0-beta.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASSET_PREFIX: authdog-cli
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  assert-release-tag:
    name: Assert tag matches release.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Assert release tag
        run: python3 scripts/assert_release_tag_matches_cargo.py

  packages:
    name: Cross-compile release archives
    needs: assert-release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # installer triple | zig target
          pairs=(
            "x86_64-unknown-linux-gnu|x86_64-linux-gnu"
            "aarch64-unknown-linux-gnu|aarch64-linux-gnu"
            "i686-unknown-linux-gnu|x86-linux-gnu"
            "armv7-unknown-linux-gnueabihf|arm-linux-gnueabihf"
            "x86_64-unknown-linux-musl|x86_64-linux-musl"
            "aarch64-unknown-linux-musl|aarch64-linux-musl"
            "x86_64-apple-darwin|x86_64-macos"
            "aarch64-apple-darwin|aarch64-macos"
            "x86_64-pc-windows-msvc|x86_64-windows"
          )
          for pair in "${pairs[@]}"; do
            triple="${pair%%|*}"
            zig_target="${pair##*|}"
            echo "Building ${triple} (${zig_target})"
            zig build -Dtarget="${zig_target}" -Doptimize=ReleaseSafe
            stage="dist/package"
            rm -rf "${stage}"
            mkdir -p "${stage}"
            if [[ "${triple}" == *windows* ]]; then
              cp zig-out/bin/authdog.exe "${stage}/authdog.exe"
              cp zig-out/bin/authdog.exe "${stage}/authdog-cli.exe"
              outfile="${ASSET_PREFIX}-${VERSION}-${triple}.zip"
              tar -acf "dist/${outfile}" -C "${stage}" authdog.exe authdog-cli.exe
              tar -tf "dist/${outfile}" | tee dist/archive-contents.txt
              grep -Fx authdog.exe dist/archive-contents.txt
              grep -Fx authdog-cli.exe dist/archive-contents.txt
            else
              cp zig-out/bin/authdog "${stage}/authdog"
              cp zig-out/bin/authdog "${stage}/authdog-cli"
              outfile="${ASSET_PREFIX}-${VERSION}-${triple}.tar.gz"
              tar czf "dist/${outfile}" -C "${stage}" authdog authdog-cli
              tar tzf "dist/${outfile}" | tee dist/archive-contents.txt
              grep -Fx authdog dist/archive-contents.txt
              grep -Fx authdog-cli dist/archive-contents.txt
            fi
            rm -rf "${stage}" dist/archive-contents.txt
          done

      - uses: actions/upload-artifact@v6
        with:
          name: packages
          path: dist/*

  github-release:
    name: Publish GitHub Release
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist

      - name: checksums.sha256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( *.tar.gz *.zip )
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release archives found"; ls -la; exit 1
          fi
          sha256sum "${files[@]}" > checksums.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') }}
